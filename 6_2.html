<!DOCTYPE html> 
<html> 
    <body> 
        <h2>24B11CS276</h2> 
        <h1>Welcome to JS</h1> 
        <h1>JavaScript Output Methods</h1> 
        <button onclick="showAlert()">Show Alert</button> 
        <button onclick="logToConsole()">Log To Console</button> 
        <button onclick="writetodocument()">Write to document</button> 
        <button onclick="updateDOM()">Update DOM</button> 
        <div id="outputArea">output will appear here.....</div> 
        <script> 
            //1.Alert box             function showAlert(){                alert("This is an alert box!");  
            } 
            //2.Consolelog             function logToConsole() 
            { 
                console.log("This message is logged to the console."); 
            } 
            //3.Document write             function writetodocument() 
            { 
                document.write("This text is written directly to the document.") 
            } 
            //4.DOM manipulation             function updateDOM() 
            { 
                document.getElementById("output area.").innerText="This text was intrested usong DOM manipulation."; 
            } 
        </script> 
    </body> 
</html>
