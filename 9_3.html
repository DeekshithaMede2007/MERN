<html>
<head>
	<title>Contact us Page</title>
	<script type="text/javascript">
		//Validation for fields
		function validation(){
			var nm=document.getElementById("name").value;
			var em=document.getElementById("email_id").value;
			var p=document.getElementById("phone").value;
			if(nm=="" && em=="" &&p=="")   {
				alert("Please enter all fields");
				return false;
			} else if(nm=="")    {
				alert("Enter Name");
				return false;
			} else if(nm.length<6)
			{  
alert("Name should not be below 6 character");
return false;
			} else if(em=="")   {
				alert("Enter Email");
				return false;
			}  else if(!/^[A-z0-9]{6,}[@][A-z]{4,5}[.][A-z]{3}$/.test(em))    {
				alert("Enter valid Email ID");
				return false;
			
                                  } else if(!/^[0-9]{10}$/.test(p)){
				alert("Enter a valid 10-digit phone number");
				return false;  }
			else{
				return true; }
		}
	</script>
</head>
<form onSubmit="return validation()" method="POST">
	<table align="center">
		<tr><td colspan="2"><h2>Contact us</h2></td> </tr>
		<tr>
                                    <td>Name</td>
			<td><input type="text" name="name" id="name"/></td>
		</tr>
		<tr><td>Email ID</td>
			<td><input type="text" name="email" id="email_id" /></td></tr>
		<tr><td>Phone number</td>
			<td><input type="text" name="phone" id="phone" /></td>
                         </tr>	
		<tr>
                          <td></td>
		<td><input type="submit" value="SUBMIT" /><input type="reset" value="CLEAR" /></td></tr>
	</table>
</form>
</html>
